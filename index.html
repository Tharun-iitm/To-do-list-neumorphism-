<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To Do List</title>
        <link rel="stylesheet" href="style2.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </head>

    <body>
        <div class="wrapper">

        
            <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>

            <h1>My Tasks</h1>

            <div class="new-task">
                <div id="taskContainer"></div>
                <button class="addTaskbtn" id="addTaskBtn">+ Add New Task</button>
            </div>

            <button class="Clear-btn" id="delAllCompleted">
                <i class="fa-solid fa-trash" style="margin-right:6px; font-size:11px;"></i>
                Delete All Completed
            </button>

            <div class="footer-controls">
                <div class="filters">
                    <button class="filter-btn active-filter" data-filter="all">All <span id="all-count">0</span></button>
                    <button class="filter-btn" data-filter="pending">Pending <span id="pending-count">0</span></button>
                    <button class="filter-btn" data-filter="completed">Done <span id="completed-count">0</span></button>
                </div>
            </div>

        </div>

        <script src="index2.js"></script>
    </body>
</html>
